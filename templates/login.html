{% extends "base.html" %}
{% block title %}Log in — Smart Alerting Hub{% endblock %}
{% block content %}
<h2>Log in</h2>
{% if error %}<div class="banner">{{ error }}</div>{% endif %}
<form method="post" style="max-width:320px;">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <p><input type="password" name="password" placeholder="Password" autofocus required style="width:100%;"></p>
  <p><button type="submit">Log in</button></p>
</form>
{% endblock %}
